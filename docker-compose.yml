services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentoffice
      POSTGRES_PASSWORD: agentoffice
      POSTGRES_DB: agentoffice
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentoffice"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      AGENTOFFICE_DATABASE_URL: postgresql+asyncpg://agentoffice:agentoffice@postgres:5432/agentoffice
      AGENTOFFICE_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
