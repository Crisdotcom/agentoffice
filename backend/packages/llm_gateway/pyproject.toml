[project]
name = "llm-gateway"
version = "0.0.1"
description = "Small, provider-agnostic LLM layer: Anthropic, OpenAI, Gemini and OpenAI-compatible APIs."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
